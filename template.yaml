AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cloud FinOps Scanner - Cross-Account IAM Role for Waste Scans & Scheduler'

Parameters:
  SaaSAccountID:
    Type: String
    Description: 'The AWS Account ID of the SaaS FinOps Platform'
    Default: '123456789012' # Replace with your SaaS AWS Account ID
  
  ExternalID:
    Type: String
    Description: 'Unique External ID provided by the FinOps Dashboard'

Resources:
  FinOpsScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FinOpsScannerCrossAccountRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${SaaSAccountID}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalID
      Policies:
        - PolicyName: FinOpsReadAndSchedulerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-Only Scanner Permissions
              - Effect: Allow
                Action:
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeSnapshots'
                  - 'rds:DescribeDBInstances'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:GetMetricData'
                Resource: '*'
              
              # Optional Resource Scheduler Permissions (For Sleep-Mode feature)
              - Effect: Allow
                Action:
                  - 'ec2:StartInstances'
                  - 'ec2:StopInstances'
                  - 'rds:StartDBInstance'
                  - 'rds:StopDBInstance'
                Resource: '*'

Outputs:
  RoleArn:
    Description: 'Copy this Role ARN and paste it into your FinOps Dashboard'
    Value: !GetAtt FinOpsScannerRole.Arn
